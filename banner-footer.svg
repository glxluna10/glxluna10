<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Footer banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcf7"/>
      <stop offset="0.55" stop-color="#fbdce8"/>
      <stop offset="1" stop-color="#fff1f5"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c4d8"/>
      <stop offset="1" stop-color="#e3d0f3"/>
    </linearGradient>
    <linearGradient id="satin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="1" stop-color="#f7a8c4"/>
    </linearGradient>
    <path id="swan" d="M15 95 C40 85 70 100 100 98 C125 96 140 92 148 80 C158 66 140 50 148 36 C152 24 166 18 176 24 L196 30 L178 34 C176 40 170 44 168 50 C164 66 182 82 170 100 C164 118 130 138 90 138 C50 138 22 118 15 95 Z"/>
    <g id="shoe">
      <!-- ribbons -->
      <path d="M30 10 C 6 30, 34 52, 8 82" stroke="#f48fb1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M36 12 C 22 36, 52 56, 34 88" stroke="#e0679a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- shoe body -->
      <path d="M10 18 C 12 40 14 52 22 58 C 50 66 90 60 124 54 C 134 50 134 38 124 34 C 100 32 70 24 52 8 C 40 2 14 6 10 18 Z" fill="url(#satin)" stroke="#e0679a" stroke-width="2" stroke-linejoin="round"/>
      <!-- toe box -->
      <path d="M98 34 C 118 36 133 40 133 46 C 133 52 120 56 98 57 C 104 50 104 42 98 34 Z" fill="#f7a8c4" stroke="#e0679a" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- sole -->
      <path d="M22 58 C 50 66 90 60 124 54" stroke="#c94f80" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- opening -->
      <path d="M12 16 C 24 24 40 18 52 8" stroke="#c94f80" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="900" height="240" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="450" cy="46" r="26" fill="#fff8fb" opacity="0.9"/>
  <circle cx="460" cy="40" r="22" fill="#fbdce8"/>

  <!-- stars -->
  <g fill="#fff" stroke="#f48fb1" stroke-width="1">
    <path d="M120 40 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M330 24 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M610 30 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></path>
    <path d="M780 56 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></path>
  </g>

  <!-- lake -->
  <rect y="150" width="900" height="90" fill="url(#lake)"/>
  <path d="M0 150 Q 225 142 450 150 T 900 150" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- ripples -->
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <ellipse cx="150" cy="168" rx="30" ry="5" opacity="0.7">
      <animate attributeName="rx" values="20;120;20" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="150" cy="168" rx="60" ry="9" opacity="0.5">
      <animate attributeName="rx" values="60;160;60" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- swan + reflection (gently bobbing) -->
  <g>
    <g transform="translate(55,40)">
      <use href="#swan" fill="#ffffff" stroke="#e9a9c2" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 100 C 70 90, 100 95, 120 110" stroke="#f3cddd" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M52 112 C 80 104, 105 108, 125 120" stroke="#f3cddd" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M176 24 L196 30 L178 34 Z" fill="#f7a8c4"/>
      <circle cx="168" cy="29" r="2.2" fill="#8a5a72"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(55,236) scale(1,-0.55)" opacity="0.25">
    <use href="#swan" fill="#c94f80"/>
  </g>

  <!-- pointe shoes (sway) -->
  <g transform="translate(705,78)">
    <g>
      <use href="#shoe" transform="translate(0,14) rotate(-5 60 40)"/>
      <use href="#shoe" transform="translate(55,0) rotate(6 60 40) scale(0.9)"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 60 0; 3 60 0; -3 60 0" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- text -->
  <text x="470" y="105" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" font-weight="700" fill="#c94f80">terima kasih sudah mampir</text>
  <text x="470" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#8a5a72" letter-spacing="3">TIRAI DITUTUP  ✦  PANGGUNG SELALU TERBUKA</text>
</svg>

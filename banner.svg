<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f5"/>
      <stop offset="0.55" stop-color="#fbdce8"/>
      <stop offset="1" stop-color="#e9dcf7"/>
    </linearGradient>
    <linearGradient id="curtainL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e58aaa"/>
      <stop offset="0.5" stop-color="#f4a9c2"/>
      <stop offset="1" stop-color="#f9c6d8"/>
    </linearGradient>
    <linearGradient id="curtainR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e58aaa"/>
      <stop offset="0.5" stop-color="#f4a9c2"/>
      <stop offset="1" stop-color="#f9c6d8"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="petal">
      <path d="M0 0 C 6 -6, 14 -2, 10 8 C 6 14, -2 10, 0 0 Z" fill="#f7a8c4" opacity="0.85"/>
    </g>
  </defs>

  <rect width="900" height="280" fill="url(#bg)"/>
  <ellipse cx="450" cy="130" rx="330" ry="150" fill="url(#spot)"/>

  <!-- stage floor -->
  <path d="M0 262 Q450 238 900 262 L900 280 L0 280 Z" fill="#f3cddd"/>
  <path d="M0 262 Q450 238 900 262" stroke="#e9a9c2" stroke-width="2" fill="none"/>

  <!-- curtains -->
  <path d="M0 0 H150 C 120 70, 170 150, 120 280 H0 Z" fill="url(#curtainL)"/>
  <path d="M40 0 C 30 90, 60 180, 40 280" stroke="#d9759a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M85 0 C 70 90, 105 180, 80 280" stroke="#d9759a" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M900 0 H750 C 780 70, 730 150, 780 280 H900 Z" fill="url(#curtainR)"/>
  <path d="M860 0 C 870 90, 840 180, 860 280" stroke="#d9759a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M815 0 C 830 90, 795 180, 820 280" stroke="#d9759a" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- valance -->
  <path d="M0 0 H900 V26 Q 825 46 750 26 T 600 26 T 450 26 T 300 26 T 150 26 T 0 26 Z" fill="#e58aaa"/>
  <path d="M0 26 Q 75 46 150 26 T 300 26 T 450 26 T 600 26 T 750 26 T 900 26" stroke="#f9c6d8" stroke-width="3" fill="none"/>

  <!-- ribbon that draws itself -->
  <path d="M215 205 C 300 170, 360 235, 450 205 S 600 170, 685 205" stroke="#e0679a" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0;0;520" keyTimes="0;0.45;0.8;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- title -->
  <text x="450" y="115" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="700" fill="#c94f80" letter-spacing="1">Saviara Aluna</text>
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#8a5a72" letter-spacing="4">BALERINA  ✦  PENULIS NOVEL  ✦  SISWI RPL</text>
  <text x="450" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#a77a92">tirai terangkat di setiap baris kode</text>

  <!-- twinkling sparkles -->
  <g fill="#fff" stroke="#f48fb1" stroke-width="1">
    <path d="M250 70 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M660 62 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></path>
    <path d="M590 225 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M300 230 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- falling petals -->
  <g>
    <g><use href="#petal"/>
      <animateTransform attributeName="transform" type="translate" values="230,-20; 270,300" dur="9s" repeatCount="indefinite"/></g>
    <g><use href="#petal"/>
      <animateTransform attributeName="transform" type="translate" values="380,-30; 340,300" dur="11s" begin="-3s" repeatCount="indefinite"/></g>
    <g><use href="#petal"/>
      <animateTransform attributeName="transform" type="translate" values="520,-20; 570,300" dur="10s" begin="-6s" repeatCount="indefinite"/></g>
    <g><use href="#petal"/>
      <animateTransform attributeName="transform" type="translate" values="690,-30; 650,300" dur="12s" begin="-2s" repeatCount="indefinite"/></g>
    <g><use href="#petal"/>
      <animateTransform attributeName="transform" type="translate" values="450,-20; 480,300" dur="13s" begin="-8s" repeatCount="indefinite"/></g>
  </g>
</svg>
